global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lab28-api
    static_configs: [{targets: ["api:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-gateway
    static_configs: [{targets: ["gateway:9901"]}]
    metrics_path: /stats/prometheus

  - job_name: lab28-kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]

  - job_name: lab28-airflow-batch
    static_configs: [{targets: ["pushgateway:9091"]}]

  - job_name: lab28-qdrant
    static_configs: [{targets: ["qdrant:6333"]}]
    metrics_path: /metrics

  - job_name: lab28-mlflow
    # MLflow has a health endpoint but no Prometheus exposition endpoint. The
    # API readiness probe publishes MLflow availability as
    # lab28_component_ready{component="mlflow"}; scrape that exporter under a
    # distinct job so target coverage and dependency health stay separate.
    static_configs: [{targets: ["api:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-feast
    static_configs: [{targets: ["feast:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-collector
    static_configs: [{targets: ["otel-collector:8888"]}]

  - job_name: lab28-prometheus
    static_configs: [{targets: ["prometheus:9090"]}]

  - job_name: lab28-vllm-optional
    # The scrape target for vLLM is written to monitoring/targets/vllm.yml — a
    # git-ignored file the runbook generates. Local GPU compose points it at
    # host.docker.internal:8001; a remote Kaggle T4 points it at the tunnel host
    # with `scheme: https`. Neither the URL nor the choice ever lands in git.
    metrics_path: /metrics
    # A remote endpoint behind a public tunnel is slower and less reliable than
    # an in-cluster target; give it a longer interval and timeout so a single
    # slow scrape does not flap the target on the SLO dashboard.
    scrape_interval: 15s
    scrape_timeout: 12s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/vllm.yml"]
